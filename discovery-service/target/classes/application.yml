server:
  port: 8761

spring:
  application:
    name: discovery-service

eureka:
  instance:
    hostname: localhost
  client:
    # This IS the registry — it should not try to register with itself or fetch from itself.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Disable self-preservation in dev to quickly evict stale services.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
